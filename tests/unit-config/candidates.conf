# name   dest                 [optional extra args...]                      upstream
# Format:
#   name dest upstream-url [extra-args ...]
# The first three fields on each non-comment line are treated as
#   name, dest, upstream-url
# Any remaining fields are passed as extra arguments to mirror-dedupe-scan
# (e.g. --gpg-key-url/--gpg-key-path).

ubuntu              ubuntu              https://archive.ubuntu.com/ubuntu --release noble
