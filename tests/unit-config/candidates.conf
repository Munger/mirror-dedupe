# name   dest                 [optional extra args...]                      upstream
# Format:
#   name dest upstream-url [extra-args ...]
# The first three fields on each non-comment line are treated as
#   name, dest, upstream-url
# Any remaining fields are passed as extra arguments to mirror-dedupe-scan
# (e.g. --gpg-key-url/--gpg-key-path).

ubuntu              ubuntu              -U https://archive.ubuntu.com/ubuntu --release noble --gpg-key-url http://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg
ubuntu-ports        ubuntu-ports        -U https://ports.ubuntu.com/ubuntu-ports --gpg-key-url http://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg
ubuntu-cloud        ubuntu-cloud        -U https://ubuntu-cloud.archive.canonical.com/ubuntu --releases noble-proposed/dalamation,noble-proposed/epoxy,noble-proposed/flamingo,noble-updates/dalamation,noble-updates/epoxy,noble-updates/flamingo --gpg-key-url http://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg
debian              debian              -U https://ftp.debian.org/debian https://mirror.yandex.ru/debian/ --gpg-key-url https://ftp-master.debian.org/keys/archive-key-12.asc

grafana             grafana             -U https://apt.grafana.com https://mirror.yandex.ru/mirrors/packages.grafana.com/oss/deb/ --repo-type apt --gpg-key-url https://apt.grafana.com/gpg.key 
influxdb            influxdb            -U https://repos.influxdata.com/debian --gpg-key-url https://repos.influxdata.com/influxdata-archive_compat.key 
docker              docker              -U https://download.docker.com/linux/ubuntu --gpg-key-url https://download.docker.com/linux/ubuntu/gpg 

postgresql          postgresql          -U http://apt.postgresql.org/pub/repos/apt --components main --gpg-key-url https://www.postgresql.org/media/keys/ACCC4CF8.asc 
mariadb             mariadb             -U https://mirror.mariadb.org/repo/10.11/ubuntu --gpg-key-url https://mirror.mariadb.org/PublicKey
mongodb             mongodb             -U https://repo.mongodb.org/apt/ubuntu https://mirror.hi.no/mongodb/apt/ubuntu/ --gpg-key-url https://pgp.mongodb.com/server-7.0.asc

nodesource-node22   nodesource/node_22.x -U https://deb.nodesource.com/node_22.x https://repo.roomeet.ir/mirror/deb.nodesource.com/node_22.x/ --gpg-key-url https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

vscode              vscode              -U https://packages.microsoft.com/repos/code --gpg-key-url https://packages.microsoft.com/keys/microsoft.asc
github-cli          github-cli          -U https://cli.github.com/packages --gpg-key-url https://cli.github.com/packages/githubcli-archive-keyring.gpg
hashicorp           hashicorp           -U https://apt.releases.hashicorp.com --gpg-key-url https://apt.releases.hashicorp.com/gpg

azure-cli           azure-cli           -U https://packages.microsoft.com/repos/azure-cli/ --gpg-key-url https://packages.microsoft.com/keys/microsoft.asc

ceph-reef           ceph/reef           -U https://download.ceph.com/debian-reef/ --gpg-key-url https://download.ceph.com/keys/release.asc

# GitLab CE/EE (official Debian/Ubuntu repo)
gitlab-ce           gitlab-ce           -U https://packages.gitlab.com/gitlab/gitlab-ce/debian/ --gpg-key-url https://packages.gitlab.com/gitlab/gitlab-ce/gpgkey
gitlab-ee           gitlab-ee           -U https://packages.gitlab.com/gitlab/gitlab-ee/debian/ --gpg-key-url https://packages.gitlab.com/gitlab/gitlab-ee/gpgkey

# Amazon Corretto (OpenJDK)
corretto            corretto            -U https://apt.corretto.aws --gpg-key-url https://apt.corretto.aws/corretto.key

# Brave browser
brave               brave               -U https://brave-browser-apt-release.s3.brave.com --gpg-key-url https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg

# NGINX official
nginx               nginx               -U https://nginx.org/packages/ubuntu  --gpg-key-url https://nginx.org/keys/nginx_signing.key

# Signal Desktop
signal-desktop      signal-desktop      -U https://updates.signal.org/desktop/apt --gpg-key-url https://updates.signal.org/desktop/apt/keys.asc

# Dovecot (IMAP server)
dovecot             dovecot             -U https://repo.dovecot.org/ce-2.4-latest/ubuntu/ --gpg-key-url https://repo.dovecot.org/DOVECOT-REPO-GPG

# Rspamd (spam filter)
rspamd              rspamd              -U https://rspamd.com/apt-stable/  --gpg-key-url https://rspamd.com/apt-stable/gpg.key

# Zabbix monitoring
zabbix              zabbix              -U https://repo.zabbix.com/zabbix/8.0/release/ubuntu/  --gpg-key-url https://repo.zabbix.com/zabbix-official-repo.key

# VirtualBox
virtualbox          virtualbox          -U https://download.virtualbox.org/virtualbox/debian  --gpg-key-url https://www.virtualbox.org/download/oracle_vbox_2016.asc

# Google Chrome
google-chrome       google-chrome       -U https://dl.google.com/linux/chrome/deb/ --gpg-key-url https://dl.google.com/linux/linux_signing_key.pub
