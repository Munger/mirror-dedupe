# Command: mirror-dedupe --scan --name mongodb -U https://mirror.hi.no/mongodb/apt/ubuntu/

name: mongodb
dest: mongodb
repo_type: apt

# During sync the first healthy upstream is used for each file.
# Comment out an entry to disable that mirror.
upstreams:
  - url: https://mirror.hi.no/mongodb/apt/ubuntu/
upstream_idx: 0  # prefer this mirror on sync - avoids mirror skew

# GPG key URL for Release file signature verification.
gpg_key_url: https://pgp.mongodb.com/server-7.0.asc

# Architectures to fetch.  Removing an architecture reduces
# download size - only the listed ones are synced.
# Use "*" or "all" to sync every available architecture.
architectures:
  - amd64
  - arm64
  - i386
  - ppc64el
  - s390x

# Package components to mirror.  Comment out or remove any
# that are not needed (e.g. "non-free", "contrib").
components:
  - multiverse

# Distribution(s) / suites to mirror.  Each name corresponds to a
# Release file on the upstream server.  Comment out a line to exclude
# that suite from sync.
#
# Glob patterns (fnmatch) are supported and resolved at sync time
# against what actually exists upstream, so new suites are picked up
# automatically.  Examples:
#   "noble*"              noble, noble-updates, noble-security, ...
#   "noble/*"             noble/mongodb-org/8.0, noble/mongodb-org/8.2, ...
#   "*/mongodb-org/7.0"   bionic/mongodb-org/7.0, focal/mongodb-org/7.0, ...
#   "noble-2?.04"         noble-24.04, noble-26.04, ...
#   "noble-2[024].04"     noble-20.04, noble-22.04, noble-24.04
#   "*"                   everything upstream
#
# You can mix globs and explicit names freely.
# Note: YAML requires quotes on values starting with * or other special characters
