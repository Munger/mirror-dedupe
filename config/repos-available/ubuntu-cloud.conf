# Generated: 2026-07-26 13:06:28
# Command: mirror-dedupe --scan --name ubuntu-cloud -U https://ubuntu-cloud.archive.canonical.com/ubuntu

name: ubuntu-cloud
dest: ubuntu-cloud
repo_type: apt

# During sync the first healthy upstream is used for each file.
# Comment out an entry to disable that mirror.
upstreams:
  - url: https://ubuntu-cloud.archive.canonical.com/ubuntu
upstream_idx: 0  # prefer this mirror on sync - avoids mirror skew

# GPG key URL for Release file signature verification.
gpg_key_url: http://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg

# Architectures to fetch.  Removing an architecture reduces
# download size - only the listed ones are synced.
architectures:
  - amd64
  - arm64

# Package components to mirror.  Comment out or remove any
# that are not needed (e.g. "non-free", "contrib").
components:
  - main

# Distribution(s) / suites to mirror.  Each name corresponds to a
# Release file on the upstream server.  Comment out a line to exclude
# that suite from sync.
#
# When expand_distributions is true (the default if unset), a base
# distribution like "noble" is automatically expanded at sync time
# to include noble-updates, noble-security, noble-backports, and
# noble-proposed.  When false, only the listed distributions are
# synced - no automatic expansion occurs.
distributions:
  - noble-proposed/dalmation
  - noble-proposed/epoxy
  - noble-proposed/flamingo
  - noble-updates/dalmation
  - noble-updates/epoxy
  - noble-updates/flamingo

# Per-repo parameter overrides.  The defaults from --scan are shown;
# uncomment and change only what you need.
#
#   discovery_method    How upstream layout was discovered: "html_bfs"
#                       (HTML index crawl) or "explicit" (dists/).
#   log_colour          ANSI colour for this repo's log label.
#   log_colour_bg       ANSI background colour for the label.
#   parallel_downloads  Per-repo worker pool size.  Inherits the global
#                       default when commented out.
params:
  discovery_method: explicit
  anchor_filename: InRelease
  log_colour: DEFAULT
  log_colour_bg: NONE
  # parallel_downloads: N
