# mirror-dedupe global configuration

# ── Paths ──────────────────────────────────────────────────────────────────

# Root directory for all mirror data.  repos/ and pool/ are created beneath it.
mirror_root: /Users/tim/Development/GitHub/mirror-dedupe/tests/root/mirror

# ── GPG Signature Verification ─────────────────────────────────────────────

check_gpg_signature: true

# ── Architecture & Distribution ────────────────────────────────────────────

# Global architecture mask — only architectures present in both this
# list and each mirror's own list are synced.  "*" or "all" means passthrough.
# Default: "*"
#architectures: ["amd64"]
architectures: all

# ── Concurrency ────────────────────────────────────────────────────────────

# Number of concurrent downloads per-repo (each repo gets its own pool).
# Can be overridden per-repo via repo.params.parallel_downloads.
# Default: 10
parallel_downloads: 5

# Maximum number of repos to sync simultaneously.
# Default: 2
max_concurrent_syncs: 5

# ── Network ────────────────────────────────────────────────────────────────

# Connection timeout for curl (seconds).  No --max-time is sent — downloads
# run as long as upstream delivers bytes.
# Default: 10
connect_timeout: 10

# ── Pool Sweep ─────────────────────────────────────────────────────────────

# Whether to run a pool orphan sweep automatically after the last repo
# finishes syncing.
# Default: false
sweep_pool_after_sync: false

# ── Logging ────────────────────────────────────────────────────────────────

# Terminal colour scheme for log output.
# Valid values: "DEFAULT", "DARK", "LIGHT", "NONE"
# Default: "DEFAULT"
# log_colour: "DEFAULT"

# Background colour for log output — needed when log_colour is set so
# the chosen palette works against a light or dark terminal background.
# Valid values: "NONE", "DARK", "LIGHT"
# Default: "NONE"
# log_colour_bg: "NONE"

# ── Additional Repositories ────────────────────────────────────────────────

# Repos not in repos-enabled/ but recognised by --list-repos, --delete,
# snapshot ops, and Config.resolve_dest().  Each entry has a name and
# dest (relative to <mirror_root>/repos, or absolute).
# additional_repos:
#   - name: some-extra-repo
#     dest: extra/some-extra-repo
