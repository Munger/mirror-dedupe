name: Build Debian Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools python3-yaml python3-build

    - name: Verify version consistency
      run: |
        CHANGELOG_VER=$(head -1 debian/changelog | sed -n 's/^mirror-dedupe (\([^-]*\)-.*/\1/p')
        INIT_VER=$(python3 -c "import mirror_dedupe; print(mirror_dedupe.__version__)")
        if [ "$CHANGELOG_VER" != "$INIT_VER" ]; then
          echo "ERROR: Version mismatch!"
          echo "  debian/changelog: $CHANGELOG_VER"
          echo "  __init__.py:      $INIT_VER"
          echo "Both must match before release."
          exit 1
        fi
        echo "Versions match: $CHANGELOG_VER"
    
    - name: Build Debian package
      run: dpkg-buildpackage -us -uc -b
    
    - name: Move deb to workspace
      run: mv ../*.deb .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package
        path: "*.deb"
    
    - name: Upload to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: "*.deb"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
