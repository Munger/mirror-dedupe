name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Build Debian Package"]
    types:
      - completed

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine PyYAML
    
    - name: Verify all modules import
      run: |
        python -c "
        import pkgutil, importlib, mirror_dedupe
        for _, name, _ in pkgutil.walk_packages(mirror_dedupe.__path__, mirror_dedupe.__name__ + '.'):
            if name.endswith('.__main__'):
                continue
            importlib.import_module(name)
        print('All modules imported successfully')
        "
    
    - name: Build package
      run: python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
