name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify changelog version matches release tag
      run: |
        CHANGELOG_VER=$(head -1 debian/changelog | sed -n 's/^mirror-dedupe (\([^-]*\)-.*/\1/p')
        TAG="${GITHUB_REF#refs/tags/}"
        EXPECTED="${TAG#v}"
        if [ "$CHANGELOG_VER" != "$EXPECTED" ]; then
          echo "ERROR: Version mismatch!"
          echo "  debian/changelog: $CHANGELOG_VER"
          echo "  git tag:          $EXPECTED (from $TAG)"
          exit 1
        fi
        echo "Version verified: $CHANGELOG_VER matches tag $TAG"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine PyYAML
    
    - name: Verify all modules import
      run: |
        python -c "
        import pkgutil, importlib, mirror_dedupe
        for _, name, _ in pkgutil.walk_packages(mirror_dedupe.__path__, mirror_dedupe.__name__ + '.'):
            if name.endswith('.__main__'):
                continue
            importlib.import_module(name)
        print('All modules imported successfully')
        "
    
    - name: Build package
      run: python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
