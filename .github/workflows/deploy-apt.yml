name: Deploy to APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      TAG:
        description: 'Release tag to deploy (e.g. v1.2.0)'
        required: true

concurrency:
  group: deploy-apt-${{ github.event.release.tag_name || github.event.inputs.TAG }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-apt:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download .deb from release
      run: |
        TAG="${{ github.event.release.tag_name || github.event.inputs.TAG }}"
        if [ -z "$TAG" ]; then
          echo "No tag determined from event.  Use workflow_dispatch with TAG input."
          exit 1
        fi
        for i in $(seq 30); do
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          DEB=$(echo "$ASSETS" | grep '^mirror-dedupe_.*\.deb$' | head -1)
          if [ -n "$DEB" ]; then
            echo "Found: $DEB"
            gh release download "$TAG" -p "$DEB"
            echo "DEB_FILE=$DEB" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Attempt $i — .deb not yet uploaded, waiting 10 s..."
          sleep 10
        done
        echo "Timed out waiting for .deb in release $TAG"
        exit 1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify .deb version matches release tag
      run: |
        TAG="${{ github.event.release.tag_name || github.event.inputs.TAG }}"
        DEB_VER="$(dpkg-deb -f "$DEB_FILE" Version)"
        EXPECTED="${TAG#v}"
        DEB_UPSTREAM="${DEB_VER%%-*}"
        if [ "$DEB_UPSTREAM" != "$EXPECTED" ]; then
          echo "ERROR: Version mismatch!"
          echo "  Expected: $EXPECTED (from tag $TAG)"
          echo "  Got:      $DEB_UPSTREAM (from ${DEB_FILE} / ${DEB_VER})"
          exit 1
        fi
        echo "Version verified: $DEB_VER matches tag $TAG"
      env:
        DEB_FILE: ${{ env.DEB_FILE }}

    - name: Checkout packages repo
      uses: actions/checkout@v4
      with:
        repository: Munger/packages
        token: ${{ secrets.PACKAGES_REPO_TOKEN }}
        path: packages

    - name: Add .deb to apt repo
      run: |
        DEST="packages/pool/main/m/mirror-dedupe"
        mkdir -p "$DEST"
        cp "$DEB_FILE" "$DEST/"
        echo "Deployed: $DEST/$DEB_FILE"

    - name: Commit and push
      run: |
        cd packages
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -m "Add mirror-dedupe $DEB_FILE"
        git push
      env:
        DEB_FILE: ${{ env.DEB_FILE }}
